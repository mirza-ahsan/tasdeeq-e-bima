name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly: catch an upstream Synthea change or dependency drift
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv sync --frozen --all-extras --python 3.12
      - name: Lint
        run: uvx ruff@0.14.0 check backend ml tests scripts --select F,E9
      - name: Tests (offline, never call Qwen)
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  reproducibility:
    # Rebuild everything from the pinned Synthea bundle and fail if the dataset is not
    # identical or the metrics drift past tolerance. Slow (~5 min), so not on every PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv sync --frozen --all-extras --python 3.12
      - run: cp models/metadata.json /tmp/committed-metadata.json
      - run: uv run python scripts/fetch_synthea.py
      - run: uv run python ml/build_dataset.py
      - run: uv run python ml/label_carc.py
      - run: uv run python ml/train.py
      - run: uv run python scripts/check_drift.py --baseline /tmp/committed-metadata.json
